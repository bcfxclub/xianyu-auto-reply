name: Build 闲鱼管家 APK

"on":
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xianyu-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: xianyu-mobile/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: xianyu-mobile/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xianyu-mobile-1.0.11-release
          path: xianyu-mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
